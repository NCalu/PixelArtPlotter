<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRBL Console</title>
<style>
  :root {
    --bg-header: #f5f5f5; --text-header: #222; --bg-viewer: #eeeeee; --text-viewer: #222;
    --btn-bg: #ddd; --btn-hover: #ccc; --scrollbar-bg: #ddd; --scrollbar-thumb: #aaa;
    --line: #bbb; --hl: #222; --hl-text: #fff; --dim: #888; --field: #fff;
  }
  body.dark {
    --bg-header: #222; --text-header: white; --bg-viewer: #2c2c2c; --text-viewer: white;
    --btn-bg: #444; --btn-hover: #555; --scrollbar-bg: #555; --scrollbar-thumb: #888;
    --line: #555; --hl: #fff; --hl-text: #000; --dim: #999; --field: #1a1a1a;
  }
  html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
  body { background: var(--bg-viewer); color: var(--text-viewer); display: flex; flex-direction: column; }

  header { height: 50px; flex: none; background: var(--bg-header); color: var(--text-header); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  header .left, header .right { display: flex; align-items: center; gap: 15px; }
  header strong { font-size: 16px; }
  button, select { background: var(--btn-bg); color: var(--text-header); border: none; padding: 5px 10px; cursor: pointer; font-size: 14px; font-family: inherit; }
  button:hover { background: var(--btn-hover); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--dim); outline-offset: 1px; }
  .theme-toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; transition: .4s; border-radius: 50px; }
  .slider:before { position: absolute; content: ""; height: 12px; width: 12px; border-radius: 50px; left: 4px; bottom: 4px; background: white; transition: .4s; }
  .switch input:checked + .slider { background: #888; }
  .switch input:checked + .slider:before { transform: translateX(14px); }
  .chk { font-size: 14px; display: flex; align-items: center; gap: 5px; }

  main { flex: 1; min-height: 0; display: flex; }
  section { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 10px; gap: 8px; }
  section + section { border-left: 1px solid var(--line); }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .bar .info { margin-left: auto; font-size: 13px; color: var(--dim); }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }

  #progress { height: 4px; background: var(--scrollbar-bg); flex: none; }
  #progress div { height: 100%; width: 0; background: var(--hl); }
  #gcode, #log { flex: 1; min-height: 0; overflow-y: auto; background: var(--field); border: 1px solid var(--line); scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-bg); }
  #gcode .ln { display: flex; padding: 1px 8px 1px 0; white-space: pre; }
  #gcode .n { width: 44px; flex: none; text-align: right; padding-right: 10px; color: var(--dim); }
  #gcode .ln.done { color: var(--dim); }
  #gcode .ln.cur { background: var(--hl); color: var(--hl-text); }
  #gcode .ln.cur .n { color: inherit; }
  #log { padding: 6px 8px; white-space: pre-wrap; word-break: break-all; }
  #log .tx { font-weight: bold; } #log .err { text-decoration: underline; } #log .sys { color: var(--dim); font-style: italic; }
  #state { padding: 5px 8px; background: var(--btn-bg); color: var(--text-header); }
  form { display: flex; gap: 6px; }
  #cmd { flex: 1; background: var(--field); color: var(--text-viewer); border: 1px solid var(--line); padding: 6px 8px; }

  @media (max-width: 800px) {
    html, body { overflow: auto; } main { flex-direction: column; }
    section { min-height: 60vh; } section + section { border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <div class="left">
    <strong>GRBL Console</strong>
    <select id="baud" aria-label="Baud rate"><option>115200</option><option>9600</option><option>19200</option><option>38400</option><option>57600</option><option>250000</option></select>
    <button id="connect">Connect</button>
  </div>
  <div class="right">
    <label class="chk"><input type="checkbox" id="poll" checked> Poll status</label>
    <div class="theme-toggle"><span>Dark</span>
      <label class="switch"><input type="checkbox" id="theme"><span class="slider"></span></label>
    </div>
  </div>
</header>

<main>
  <section>
    <div class="bar">
      <button id="run" disabled>Run</button>
      <button id="pause" disabled>Pause</button>
      <button id="step" disabled>Step</button>
      <button id="stop" disabled>Stop</button>
      <span class="info" id="runinfo">Line 0 / 0</span>
    </div>
    <div id="progress"><div></div></div>
    <div id="gcode" class="mono" aria-label="G-code program"></div>
  </section>

  <section>
    <div id="state" class="mono">State: —</div>
    <div class="bar">
      <button data-cmd="$$">$$</button><button data-cmd="$#">$#</button><button data-cmd="$G">$G</button>
      <button data-cmd="$I">$I</button><button data-cmd="$H">Home</button><button data-cmd="$X">Unlock</button>
      <button data-rt="?">?</button><button data-rt="!">Hold</button><button data-rt="~">Resume</button>
      <button data-rt="reset">Reset</button><button id="clear">Clear</button>
    </div>
    <div id="log" class="mono" role="log"></div>
    <form id="form" autocomplete="off">
      <input id="cmd" class="mono" placeholder="Command, then Enter (↑/↓ history)" disabled>
      <button id="send" disabled>Send</button>
    </form>
  </section>
</main>

(() => {
  const $ = id => document.getElementById(id);
  const logEl = $('log'), cmdEl = $('cmd'), gEl = $('gcode');
  const enc = new TextEncoder();
  let port, reader, writer, keepReading = false, pollTimer, buf = '';
  const history = []; let histIdx = 0;

  // ---- theme ----
  const savedTheme = (() => { try { return localStorage.getItem('theme'); } catch { return null; } })();
  if (savedTheme === 'dark') { document.body.classList.add('dark'); $('theme').checked = true; }
  $('theme').onchange = e => {
    document.body.classList.toggle('dark', e.target.checked);
    try { localStorage.setItem('theme', e.target.checked ? 'dark' : 'light'); } catch {}
  };

  // ---- G-code viewer ----
  const lines = GCODE.split('\n');
  const rows = lines.map((t, i) => {
    const d = document.createElement('div'); d.className = 'ln';
    d.innerHTML = '<span class="n">' + (i + 1) + '</span><span></span>';
    d.lastChild.textContent = t; gEl.appendChild(d); return d;
  });
  const clean = t => t.replace(/\(.*?\)/g, '').replace(/;.*$/, '').trim();

  let idx = 0, running = false, paused = false, waiting = false, pauseNote = '';

  function updateInfo() {
    $('runinfo').textContent = 'Line ' + Math.min(idx + (waiting ? 1 : 0), lines.length) + ' / ' + lines.length + (paused && running ? ' · ' + (pauseNote || 'paused') : '');
    $('progress').firstChild.style.width = (100 * idx / lines.length) + '%';
  }
  function mark() {
    rows.forEach((r, i) => { r.classList.toggle('done', i < idx); r.classList.toggle('cur', i === idx && (running || waiting)); });
    rows[Math.min(idx, rows.length - 1)].scrollIntoView({ block: 'center' });
    updateInfo();
  }
  function buttons() {
    const on = !!writer;
    $('run').disabled = !on || running; $('step').disabled = !on || running && !paused || waiting;
    $('pause').disabled = !on || !running; $('stop').disabled = !on || (!running && idx === 0);
    $('pause').textContent = paused ? 'Resume' : 'Pause';
    $('run').textContent = idx > 0 && idx < lines.length && !running ? 'Continue' : 'Run';
  }

  function pump(single) {
    if (!writer || waiting || (paused && !single)) return;
    while (idx < lines.length && !clean(lines[idx])) idx++;          // skip blank/comment lines
    if (idx >= lines.length) { running = false; paused = false; log('Program finished', 'sys'); mark(); buttons(); return; }
    waiting = true; mark();
    sendLine(clean(lines[idx])).catch(e => { log('Write error: ' + e.message, 'err'); haltStream(); });
    buttons();
    if (single) running = running; // step: only one line, ok handler won't continue unless running
  }
  function onOk() {
    if (!waiting) return;
    waiting = false; idx++; mark();
    if (running && !paused) pump(); else buttons();
  }
  function onError() {
    if (!waiting) return;
    waiting = false; paused = true; mark(); buttons();
    log('Stopped at line ' + (idx + 1) + ' — fix the issue, then Resume or Stop', 'sys');
  }
  // The controller can pause by itself (M0 in the program) or the user can hit Hold in the console.
  // GRBL does not answer 'ok' for an M0 line until it is resumed, so the status report is what tells us.
  function onStatus(st) {
    if (!running) return;
    if (st === 'Hold:0' && !paused) {
      paused = true;
      pauseNote = waiting && /\bM0*\b(?!\.?\d)/i.test(clean(lines[idx] || '')) ? 'paused by M0' : 'held by controller';
      log('Program paused (' + pauseNote + ') at line ' + (idx + 1) + ' — press Resume to continue', 'sys');
      mark(); buttons();
    } else if (paused && pauseNote && !st.startsWith('Hold')) {
      // resumed from elsewhere (e.g. the ~ button in the console)
      paused = false; pauseNote = ''; mark(); buttons(); pump();
    }
  }
  function haltStream() { running = false; paused = false; waiting = false; pauseNote = ''; mark(); buttons(); }

  $('run').onclick = () => { if (idx >= lines.length) idx = 0; running = true; paused = false; pump(); };
  $('step').onclick = () => { if (idx >= lines.length) idx = 0; if (!running) { pump(true); } else if (paused) { pump(true); } };
  $('pause').onclick = () => {
    if (!paused) { paused = true; pauseNote = 'paused'; sendRealtime('!'); }
    else { paused = false; pauseNote = ''; sendRealtime('~'); pump(); mark(); }
    buttons();
  };
  $('stop').onclick = async () => {
    await sendRealtime('!'); haltStream();
    setTimeout(() => { sendRealtime('\x18'); idx = 0; mark(); buttons(); }, 150);
    log('Program stopped (feed hold + reset)', 'sys');
  };

  // ---- console ----
  function log(text, cls) {
    const bottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 20;
    const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = text;
    logEl.appendChild(d);
    while (logEl.children.length > 2000) logEl.removeChild(logEl.firstChild);
    if (bottom) logEl.scrollTop = logEl.scrollHeight;
  }
  function setConnected(on) {
    $('connect').textContent = on ? 'Disconnect' : 'Connect';
    cmdEl.disabled = $('send').disabled = !on; $('baud').disabled = on;
    buttons(); if (on) cmdEl.focus();
  }

  async function connect() {
    if (!('serial' in navigator)) { log('Web Serial not supported. Use Chrome or Edge.', 'err'); return; }
    try { port = await navigator.serial.requestPort(); await port.open({ baudRate: +$('baud').value }); }
    catch (e) { log('Connection failed: ' + e.message, 'err'); return; }
    writer = port.writable.getWriter(); keepReading = true; setConnected(true);
    log('Connected at ' + $('baud').value + ' baud', 'sys');
    readLoop(); setTimeout(() => sendRealtime('\x18'), 100);
    pollTimer = setInterval(() => { if (($('poll').checked || running) && writer) sendRealtime('?').catch(() => {}); }, 250);
  }
  async function disconnect() {
    keepReading = false; clearInterval(pollTimer); haltStream();
    try { await reader?.cancel(); } catch {}
    try { writer?.releaseLock(); } catch {}
    try { await port?.close(); } catch {}
    port = reader = writer = null; setConnected(false); log('Disconnected', 'sys');
  }
  async function readLoop() {
    const dec = new TextDecoder();
    while (port?.readable && keepReading) {
      reader = port.readable.getReader();
      try {
        while (true) {
          const { value, done } = await reader.read(); if (done) break;
          buf += dec.decode(value, { stream: true }); let i;
          while ((i = buf.search(/\r?\n/)) >= 0) { handleLine(buf.slice(0, i)); buf = buf.slice(i + (buf[i] === '\r' ? 2 : 1)); }
        }
      } catch (e) { if (keepReading) log('Read error: ' + e.message, 'err'); }
      finally { reader.releaseLock(); }
    }
    if (keepReading) disconnect();
  }
  function handleLine(l) {
    if (!l.trim()) return;
    if (l[0] === '<' && l.endsWith('>')) { const st = l.slice(1, -1); $('state').textContent = 'State: ' + st; onStatus(st.split('|')[0]); return; }
    const isErr = /^(error|ALARM)/i.test(l);
    log(l, isErr ? 'err' : '');
    if (/^ok/i.test(l)) onOk(); else if (isErr) onError();
  }
  async function sendLine(t) { await writer.write(enc.encode(t + '\n')); log('> ' + t, 'tx'); }
  async function sendRealtime(c) {
    if (!writer) return; await writer.write(enc.encode(c));
    if (c !== '?') log('> [' + (c === '\x18' ? 'reset' : c) + ']', 'tx');
  }

  $('connect').onclick = () => port ? disconnect() : connect();
  $('clear').onclick = () => { logEl.textContent = ''; };
  $('form').onsubmit = e => {
    e.preventDefault(); const t = cmdEl.value.trim(); if (!t) return;
    history.push(t); histIdx = history.length; cmdEl.value = '';
    sendLine(t).catch(err => log('Write error: ' + err.message, 'err'));
  };
  cmdEl.onkeydown = e => {
    if (e.key === 'ArrowUp' && histIdx > 0) { cmdEl.value = history[--histIdx]; e.preventDefault(); }
    else if (e.key === 'ArrowDown') { cmdEl.value = histIdx < history.length - 1 ? history[++histIdx] : (histIdx = history.length, ''); e.preventDefault(); }
  };
  document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => sendLine(b.dataset.cmd));
  document.querySelectorAll('[data-rt]').forEach(b => b.onclick = () => sendRealtime(b.dataset.rt === 'reset' ? '\x18' : b.dataset.rt));
  navigator.serial?.addEventListener('disconnect', () => { if (port) disconnect(); });
  setConnected(false); mark();
})();
</script>
</body>
</html>
